[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyter-jcli"
version = "0.8.1"
description = "CLI tool for LLM agents to operate Jupyter Lab servers"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "tttpob", email = "i@tpob.io" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8",
    "jupyter-kernel-client>=0.7.3,<1",
    "jupyter-server-client",
    "nbformat>=5",
    "pyyaml>=6",
    "tree-sitter>=0.22",
    "tree-sitter-bash>=0.22",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
test = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-xdist",
    "ipython>=8",
    "jupyter-server>=2,<3",
    "ipykernel",
    "matplotlib",
]

[project.scripts]
j-cli = "jupyter_jcli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jupyter_jcli"]

[tool.hatch.build.targets.wheel.force-include]
"skills/j-cli" = "jupyter_jcli/skills/j-cli"

[tool.hatch.build.targets.sdist.force-include]
"skills/j-cli" = "skills/j-cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

# use uvx pyrefly to run pyrefly
# and uvx ruff to run ruff
[tool.pyrefly]
preset = "basic"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
